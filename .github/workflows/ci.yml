name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (migrations + security tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Boots local Postgres/Auth/Realtime and applies every migration in
      # order, exactly like a contributor's first `supabase start` would.
      # This is what caught two real bugs (pgcrypto search_path, missing
      # column defaults) during development - see backend/README.md.
      - run: supabase start

      # Every privacy and security test in backend/tests (who can see whose
      # location, curfew, shifts, SOS, billing...) against that fresh
      # database. Each rolls itself back; any FAIL fails the build.
      - run: tests/run_all.sh

  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Not `npm ci`: one of Vite 8's optional WASM fallback deps
      # (@emnapi/*, pulled in transitively via rolldown) is declared with a
      # loose semver range upstream, so the exact resolved version drifts
      # between installs and trips npm ci's strict lockfile match. npm
      # install tolerates that while still respecting the lockfile for
      # everything pinned.
      - run: npm install
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --watchAll=false
