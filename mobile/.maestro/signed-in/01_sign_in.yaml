# Signs in with a test account. Every signed-in flow starts with this.
#   maestro test -e EMAIL=you@example.com -e PASSWORD=... .maestro/signed-in
# Use a test account, not one with real family on it: these flows send a
# check-in to its circle and clock it in and out.
appId: com.surendrabk.safecircle
---
- launchApp:
    clearState: true
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: ${PASSWORD}
- tapOn: "Welcome back"     # closes the keyboard (hideKeyboard means Back on Android)
- tapOn: "Sign in"    # the button (the screen's title is "Welcome back")
# a wrong EMAIL or PASSWORD stops here, and the label says why
- extendedWaitUntil:
    visible: "Map, tab.*"
    timeout: 20000
    label: "Signed in (if this fails: is EMAIL / PASSWORD a real test account?)"
